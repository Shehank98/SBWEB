<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | Kade dashboard</title>
  <meta name="robots" content="noindex">
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/kade.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div>
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main" tabindex="-1">
        <div class="page-head"><div><h1>Reports</h1><p id="sub">Sales and product performance for your store.</p></div></div>
        <div id="body"></div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var K = Kade, D = KadeData;
      K.shell('dashboard', 'reports');

      var me = D.businesses[0];
      // ?as=starter|business|pro lets you preview how each plan sees this page.
      var override = (new URLSearchParams(location.search).get('as') || '').toLowerCase();
      var planName = override ? override.charAt(0).toUpperCase() + override.slice(1) : me.plan;
      var body = K.$('#body');

      // Starter has no reports — show what unlocks them.
      if (planName === 'Starter') {
        K.$('#sub').textContent = 'Upgrade to unlock sales reports.';
        body.innerHTML = '<section class="kd-card panel" style="text-align:center;max-width:560px;margin:24px auto">' +
          '<h2 class="heading">Reports are a Business feature</h2>' +
          '<p class="muted" style="margin-top:8px">Your Starter plan covers products and orders. Upgrade to <strong>Business</strong> for sales reports, or <strong>Pro</strong> for advanced customer and location insights.</p>' +
          '<div class="row" style="justify-content:center;margin-top:16px"><a class="kd-btn kd-btn--primary" href="subscription.html">See plans</a></div></section>';
        return;
      }

      var orders = K.orders();
      var products = D.products.filter(function (p) { return p.store === 'abc-fashion'; });
      var counted = orders.filter(function (o) { return o.status !== 'CANCELLED'; });
      var revenue = counted.reduce(function (n, o) { return n + o.total; }, 0);
      var itemsSold = counted.reduce(function (n, o) { return n + o.items.reduce(function (m, i) { return m + i.qty; }, 0); }, 0);
      var avg = counted.length ? Math.round(revenue / counted.length) : 0;
      var low = products.filter(function (p) { return p.stock <= p.lowAt; });

      var tiles = [
        ['Revenue', K.rs(revenue), counted.length + ' paid orders'],
        ['Orders', orders.length, 'All time'],
        ['Average order', K.rs(avg), 'Per paid order'],
        ['Items sold', itemsSold, 'Units across orders'],
        ['Low or out of stock', low.length, low.length ? 'Restock soon' : 'All stocked']
      ];

      // Orders by status
      var STATUS = ['PENDING', 'CONFIRMED', 'PROCESSING', 'READY_TO_SHIP', 'SHIPPED', 'DELIVERED', 'CANCELLED'];
      var byStatus = STATUS.map(function (s) { return { label: K.orderLabel(s), value: orders.filter(function (o) { return o.status === s; }).length }; }).filter(function (d) { return d.value > 0; });

      // Top products by units sold (match order item names to product names)
      var top = products.map(function (p) {
        var units = 0, rev = 0;
        counted.forEach(function (o) { o.items.forEach(function (i) { if (i.name === p.name || i.name.indexOf(p.name + ' (') === 0) { units += i.qty; rev += i.qty * i.price; } }); });
        return { p: p, units: units, rev: rev };
      }).filter(function (r) { return r.units > 0; }).sort(function (a, b) { return b.units - a.units; });

      var sales7 = D.sales7.map(function (d) { var dt = new Date(d.date + 'T00:00:00'); return { label: dt.toLocaleDateString('en-GB', { weekday: 'short' }), title: dt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' }), value: d.value }; });

      body.innerHTML =
        '<div class="tiles">' + tiles.map(function (t) { return '<div class="kd-card stat"><span class="stat__label">' + t[0] + '</span><span class="stat__value">' + t[1] + '</span><span class="stat__delta">' + t[2] + '</span></div>'; }).join('') + '</div>' +
        '<div class="grid-2">' +
        '<section class="kd-card panel" aria-labelledby="r1"><h2 id="r1">Sales, last 7 days</h2><div id="chart1"></div></section>' +
        '<section class="kd-card panel" aria-labelledby="r2"><h2 id="r2">Orders by status</h2><div id="chart2"></div></section>' +
        '</div>' +
        '<section class="kd-card" aria-labelledby="r3"><h2 class="heading" id="r3" style="padding:16px 16px 0">Top products</h2><div class="table-wrap"><table class="kd-table"><thead><tr><th scope="col">Product</th><th scope="col">Category</th><th scope="col" class="kd-num">Units sold</th><th scope="col" class="kd-num">Revenue</th></tr></thead><tbody id="toprows"></tbody></table></div>' +
        (top.length ? '' : '<div class="empty"><p class="muted">No sales yet. Reports fill in as orders come through.</p></div>') + '</section>' +
        '<section class="kd-card panel" aria-labelledby="r4" id="advanced" style="margin-top:24px"></section>';

      K.bars(K.$('#chart1'), sales7, { label: 'Sales per day for the last 7 days, in rupees', xLabel: 'Day', yLabel: 'Sales' });
      if (byStatus.length) K.bars(K.$('#chart2'), byStatus, { label: 'Orders by status', xLabel: 'Status', yLabel: 'Orders', format: function (v) { return v + (v === 1 ? ' order' : ' orders'); } });
      else K.$('#chart2').innerHTML = '<p class="muted">No orders yet.</p>';

      K.$('#toprows').innerHTML = top.map(function (r) {
        return '<tr><td><div class="cell-flex"><div class="thumb">' + K.ph(r.p, true) + '</div><strong>' + K.esc(r.p.name) + '</strong></div></td><td>' + K.esc(r.p.category) + '</td><td class="kd-num">' + r.units + '</td><td class="kd-num">' + K.rs(r.rev) + '</td></tr>';
      }).join('');

      // Advanced insights — Pro only.
      var adv = K.$('#advanced');
      if (planName === 'Pro') {
        var cities = {};
        counted.forEach(function (o) { var c = o.city || 'Unknown'; cities[c] = (cities[c] || 0) + 1; });
        var cityRows = Object.keys(cities).map(function (c) { return { c: c, n: cities[c] }; }).sort(function (a, b) { return b.n - a.n; });
        adv.innerHTML = '<h2 id="r4">Advanced insights <span class="kd-badge kd-badge--success">Pro</span></h2>' +
          '<p class="muted">Where your orders come from.</p>' +
          '<div class="table-wrap"><table class="kd-table"><thead><tr><th scope="col">Town or city</th><th scope="col" class="kd-num">Orders</th></tr></thead><tbody>' +
          cityRows.map(function (r) { return '<tr><td>' + K.esc(r.c) + '</td><td class="kd-num">' + r.n + '</td></tr>'; }).join('') + '</tbody></table></div>';
      } else {
        adv.classList.add('locked');
        adv.innerHTML = '<div class="locked__body"><h2 id="r4">Advanced insights</h2>' +
          '<p class="muted" style="margin-top:8px">Customer and location insights — where your orders come from, repeat customers and more — are part of the <strong>Pro</strong> plan.</p>' +
          '<div class="row" style="margin-top:12px"><a class="kd-btn kd-btn--secondary" href="subscription.html">Upgrade to Pro</a></div></div>';
      }
    })();
  </script>
</body>
</html>
