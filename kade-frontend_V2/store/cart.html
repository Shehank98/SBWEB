<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your cart</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/kade.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to cart</a>
  <div id="store-header"></div>
  <main id="main" class="container" tabindex="-1"></main>
  <div id="store-footer"></div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/store.js"></script>
  <script>
    (function () {
      var K = Kade, D = KadeData;
      K.loadStore(function (s, products) {
      document.title = 'Your cart | ' + s.name;
      var main = K.$('#main'), DISTRICTS = ['Ampara','Anuradhapura','Badulla','Batticaloa','Colombo','Galle','Gampaha','Hambantota','Jaffna','Kalutara','Kandy','Kegalle','Kilinochchi','Kurunegala','Mannar','Matale','Matara','Monaragala','Mullaitivu','Nuwara Eliya','Polonnaruwa','Puttalam','Ratnapura','Trincomalee','Vavuniya'];
      var method = 'delivery', pay = s.payments.cod ? 'cod' : 'bank', step = 1, applied = null;

      function lines() {
        return K.cart.get(s.slug).map(function (i) { var p = products.filter(function (x) { return x.id === i.pid; })[0]; return p ? { i: i, p: p } : null; }).filter(Boolean);
      }
      function money() {
        var sub = lines().reduce(function (n, l) { return n + K.priceOf(l.p) * l.i.qty; }, 0);
        var free = s.delivery.freeAbove > 0 && sub >= s.delivery.freeAbove;
        var fee = method === 'pickup' || free ? 0 : s.delivery.fee;
        var discount = applied ? Math.min(applied.discount, sub) : 0;
        return { sub: sub, fee: fee, free: free, discount: discount, total: Math.max(0, sub - discount) + fee };
      }
      function applyLocal(code, sub) {
        var c = String(code).toUpperCase();
        if (c === 'WELCOME10') return { valid: true, code: 'WELCOME10', discount: Math.round(sub * 0.1) };
        if (c === 'SHIP500') return sub >= 5000 ? { valid: true, code: 'SHIP500', discount: 500 } : { valid: false, message: 'Spend at least Rs. 5,000 to use this code.' };
        return { valid: false, message: 'That code is not valid.' };
      }
      function optTxt(o) { var k = Object.keys(o || {}); return k.length ? k.map(function (g) { return o[g]; }).join(', ') : ''; }

      function view() {
        var ls = lines();
        if (!ls.length) {
          main.innerHTML = '<div class="empty"><h1 class="heading">Your cart is empty</h1><p class="muted">Find something you like and it will show up here.</p><a class="kd-btn kd-btn--primary" href="' + K.sUrl('index') + '">Browse products</a></div>'; return;
        }
        var m = money();
        var payOpts = [['cod', 'Cash on delivery', 'Pay the rider when your order arrives.'], ['bank', 'Bank transfer', 'Send the amount to the shop account and share the slip on WhatsApp.']].filter(function (o) { return s.payments[o[0]]; });
        main.innerHTML = '<h1 class="display-md" style="padding-top:24px">Your cart</h1><div class="cart-layout">' +
          '<section class="kd-card" aria-label="Items in your cart">' + ls.map(function (l, n) {
            return '<div class="cart-line"><div class="cart-line__img">' + K.ph(l.p, true) + '</div><div><a class="kd-link" href="' + K.sUrl('product', '&p=' + l.p.id) + '">' + K.esc(l.p.name) + '</a><div class="muted" style="font-size:14px">' + K.esc(optTxt(l.i.opts)) + '</div>' +
              '<div class="cart-line__row"><div class="qty" role="group" aria-label="Quantity of ' + K.esc(l.p.name) + '"><button type="button" data-dec="' + n + '" aria-label="Decrease quantity">&minus;</button><output>' + l.i.qty + '</output><button type="button" data-inc="' + n + '" aria-label="Increase quantity">+</button></div><span class="price-sm">' + K.rs(K.priceOf(l.p) * l.i.qty) + '</span></div>' +
              '<button type="button" class="kd-btn kd-btn--ghost kd-btn--sm" data-rm="' + n + '" style="margin-top:4px;padding-left:0">Remove</button></div></div>';
          }).join('') + '</section>' +
          '<form class="kd-card panel stack-lg" id="co" novalidate style="padding:24px"><h2 class="heading">Checkout</h2>' +
          '<ol class="stepper" id="co-steps" aria-label="Checkout progress"><li aria-current="step">1. Contact</li><li>2. Delivery</li><li>3. Payment</li></ol>' +

          /* Step 1 — contact */
          '<section data-cstep="1" class="form-grid form-grid--2" aria-label="Contact details">' +
          '<div class="kd-field span-2"><label class="kd-label" for="fn">Full name</label><input class="kd-input" id="fn" data-rule="required" autocomplete="name"></div>' +
          '<div class="kd-field"><label class="kd-label" for="ph">Phone</label><input class="kd-input" id="ph" type="tel" inputmode="tel" data-rule="phone" placeholder="077 123 4567" autocomplete="tel"></div>' +
          '<div class="kd-field"><label class="kd-label" for="wa">WhatsApp (optional)</label><input class="kd-input" id="wa" type="tel" inputmode="tel" placeholder="Same as phone"></div>' +
          '<div class="kd-field span-2"><label class="kd-label" for="em">Email (optional)</label><input class="kd-input" id="em" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email"><span class="kd-help">For order updates by email.</span></div>' +
          '</section>' +

          /* Step 2 — delivery / pickup */
          '<section data-cstep="2" class="form-grid form-grid--2" aria-label="Delivery" hidden>' +
          '<fieldset class="span-2" style="border:0;padding:0;margin:0"><legend class="kd-label">How do you want it?</legend><div class="choice" style="margin-top:8px">' +
          '<label><input type="radio" name="method" value="delivery"' + (method === 'delivery' ? ' checked' : '') + '><span><strong>Delivery</strong><br><span class="muted">' + (s.delivery.freeAbove > 0 ? K.rs(s.delivery.fee) + ', free above ' + K.rs(s.delivery.freeAbove) : K.rs(s.delivery.fee)) + '</span></span></label>' +
          (s.delivery.pickup ? '<label><input type="radio" name="method" value="pickup"' + (method === 'pickup' ? ' checked' : '') + '><span><strong>Pick up from the shop</strong><br><span class="muted">' + K.esc(s.address) + '. Free.</span></span></label>' : '') + '</div></fieldset>' +
          (method === 'delivery' ? '<div class="kd-field span-2"><label class="kd-label" for="ad">Delivery address</label><input class="kd-input" id="ad" data-rule="required" autocomplete="street-address"></div>' +
            '<div class="kd-field"><label class="kd-label" for="ct">Town or city</label><input class="kd-input" id="ct" data-rule="required" autocomplete="address-level2"></div>' +
            '<div class="kd-field"><label class="kd-label" for="ds">District</label><select class="kd-select" id="ds" data-rule="required"><option value="">Choose one</option>' + DISTRICTS.map(function (d) { return '<option>' + d + '</option>'; }).join('') + '</select></div>'
            : '<p class="muted span-2">Collect your order from ' + K.esc(s.address) + '.</p>') +
          '</section>' +

          /* Step 3 — payment + review */
          '<section data-cstep="3" class="stack-lg" aria-label="Payment" hidden>' +
          '<fieldset style="border:0;padding:0;margin:0"><legend class="kd-label">Payment</legend><div class="choice" style="margin-top:8px">' + payOpts.map(function (o) { return '<label><input type="radio" name="pay" value="' + o[0] + '"' + (pay === o[0] ? ' checked' : '') + '><span><strong>' + o[1] + '</strong><br><span class="muted">' + o[2] + '</span></span></label>'; }).join('') + '</div></fieldset>' +
          (pay === 'bank' ? '<div class="kd-banner kd-banner--info"><div><p class="kd-banner__title">Shop bank account</p><p style="margin-top:4px">' + K.esc(s.bank) + '</p></div></div>' : '') +
          '<div class="kd-field"><label class="kd-label" for="nt">Note for the shop (optional)</label><textarea class="kd-input" id="nt"></textarea></div>' +
          (applied
            ? '<div class="kd-banner kd-banner--success"><div><p class="kd-banner__title">Code ' + K.esc(applied.code) + ' applied</p><p style="margin-top:4px">' + K.rs(m.discount) + ' off your order.</p></div><button type="button" class="kd-btn kd-btn--ghost kd-btn--sm" id="removeCoupon">Remove</button></div>'
            : '<div class="kd-field"><label class="kd-label" for="coupon">Coupon code (optional)</label><div class="row" style="gap:8px"><input class="kd-input" id="coupon" autocapitalize="characters" autocomplete="off" placeholder="WELCOME10" style="flex:1"><button type="button" class="kd-btn kd-btn--secondary" id="applyCoupon">Apply</button></div><span class="kd-help" id="couponMsg"></span></div>') +
          '<div class="totals" aria-live="polite"><div><span>Subtotal</span><span class="price-sm">' + K.rs(m.sub) + '</span></div>' +
          (m.discount ? '<div><span>Discount (' + K.esc(applied.code) + ')</span><span class="price-sm">-' + K.rs(m.discount) + '</span></div>' : '') +
          '<div><span>' + (method === 'pickup' ? 'Pickup' : 'Delivery') + '</span><span class="price-sm">' + (m.fee ? K.rs(m.fee) : 'Free') + '</span></div>' +
          (method === 'delivery' && !m.free && s.delivery.freeAbove > 0 ? '<p class="muted" style="font-size:14px">Add ' + K.rs(s.delivery.freeAbove - m.sub) + ' more for free delivery.</p>' : '') +
          '<div class="grand"><span>Total</span><span class="price">' + K.rs(m.total) + '</span></div></div>' +
          '</section>' +

          '<div class="row row--between" style="margin-top:8px"><button type="button" class="kd-btn kd-btn--ghost" id="co-back" hidden>Back</button><span style="flex:1"></span><button class="kd-btn kd-btn--primary" id="co-next" type="submit">Continue</button></div>' +
          '</form></div>';
        showStep(step);
      }

      function saveForm() { var f = {}; K.$$('#co input:not([type=radio]), #co select, #co textarea').forEach(function (e) { f[e.id] = e.value; }); return f; }
      function restore(f) { Object.keys(f || {}).forEach(function (k) { var e = document.getElementById(k); if (e) e.value = f[k]; }); }

      /* Stepped checkout: show one step at a time (Contact -> Delivery -> Payment). */
      function showStep(n) {
        step = Math.max(1, Math.min(3, n));
        K.$$('#co [data-cstep]').forEach(function (sec) { sec.hidden = +sec.getAttribute('data-cstep') !== step; });
        K.$$('#co-steps li').forEach(function (li, i) { li.className = (i + 1 < step ? 'done' : ''); if (i + 1 === step) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current'); });
        var back = K.$('#co-back'), next = K.$('#co-next');
        if (back) back.hidden = step === 1;
        if (next) next.textContent = step === 3 ? 'Place order' : 'Continue';
      }
      function focusStep() { var sec = K.$('[data-cstep="' + step + '"]'); var f = sec && K.$('input, select, textarea', sec); if (f) f.focus(); window.scrollTo({ top: 0 }); }

      function applyCode() {
        var input = K.$('#coupon'), msg = K.$('#couponMsg'), code = input ? input.value.trim() : '';
        if (!code) { if (msg) { msg.textContent = 'Enter a code.'; msg.style.color = 'var(--danger)'; } return; }
        var sub = money().sub;
        function ok(res) { if (res.valid) { applied = { code: res.code, discount: res.discount }; var f = saveForm(); view(); restore(f); showStep(3); } else if (msg) { msg.textContent = res.message || 'That code is not valid.'; msg.style.color = 'var(--danger)'; } }
        if (window.KadeApi && KadeApi.enabled) {
          var restore2 = K.btnLoading(K.$('#applyCoupon'), 'Checking…');
          KadeApi.applyCoupon(s.slug, code, sub).then(function (r) { if (r.valid) ok(r); else { restore2(); if (msg) { msg.textContent = r.message; msg.style.color = 'var(--danger)'; } } }).catch(function (ex) { restore2(); if (msg) { msg.textContent = ex.message || 'Could not apply the code.'; msg.style.color = 'var(--danger)'; } });
        } else ok(applyLocal(code, sub));
      }

      main.addEventListener('click', function (e) {
        var t = e.target.closest('button'); if (!t) return;
        if (t.id === 'co-back') { showStep(step - 1); focusStep(); return; }
        if (t.id === 'applyCoupon') { applyCode(); return; }
        if (t.id === 'removeCoupon') { applied = null; var fr = saveForm(); view(); restore(fr); showStep(3); return; }
        var items = K.cart.get(s.slug), n;
        if ((n = t.getAttribute('data-inc')) != null) items[n].qty = Math.min(items[n].qty + 1, 20);
        else if ((n = t.getAttribute('data-dec')) != null) items[n].qty = Math.max(items[n].qty - 1, 1);
        else if ((n = t.getAttribute('data-rm')) != null) items.splice(+n, 1);
        else return;
        var f = saveForm(); K.cart.set(s.slug, items); view(); restore(f); K.updateCartCount();
      });
      main.addEventListener('change', function (e) {
        if (e.target.name === 'method' || e.target.name === 'pay') { var f = saveForm(); if (e.target.name === 'method') method = e.target.value; else pay = e.target.value; view(); restore(f); }
      });

      function err(inp, msg) {
        var f = inp.closest('.kd-field'), o = f.querySelector('.kd-error'); if (o) o.remove();
        f.classList.toggle('kd-field--error', !!msg); inp.setAttribute('aria-invalid', msg ? 'true' : 'false');
        if (msg) { var e = document.createElement('span'); e.className = 'kd-error'; e.textContent = msg; f.appendChild(e); }
      }
      main.addEventListener('submit', function (e) {
        e.preventDefault(); var first = null;
        /* Validate only the fields on the current step. */
        var sec = K.$('[data-cstep="' + step + '"]');
        K.$$('[data-rule]', sec).forEach(function (inp) {
          var msg = inp.getAttribute('data-rule') === 'phone' ? (/^(\+94|0)\d{9}$/.test(inp.value.replace(/[\s-]/g, '')) ? '' : 'Enter a phone number like 077 123 4567.') : (inp.value.trim() ? '' : 'This field is needed.');
          err(inp, msg); if (msg && !first) first = inp;
        });
        if (first) { first.focus(); return; }
        /* Steps 1-2: advance. Step 3: place the order. */
        if (step < 3) { showStep(step + 1); focusStep(); return; }
        var ls = lines(), m = money(), v = function (id) { var x = document.getElementById(id); return x ? x.value.trim() : ''; };
        var itemsOut = ls.map(function (l) { var o = optTxt(l.i.opts); return { name: l.p.name + (o ? ' (' + o + ')' : ''), qty: l.i.qty, price: K.priceOf(l.p) }; });
        var payLabel = pay === 'cod' ? 'Cash on delivery' : 'Bank transfer';
        if (window.KadeApi && KadeApi.enabled) {
          var restore = K.btnLoading(K.$('#co-next'), 'Placing order…');
          KadeApi.placeOrder(s.slug, {
            customer: v('fn'), phone: v('ph'), whatsapp: v('wa'), email: v('em'),
            address: v('ad'), city: method === 'pickup' ? 'Pickup' : v('ct'), district: v('ds'),
            delivery: method === 'pickup' ? 'Pickup' : 'Delivery', payment: payLabel, note: v('nt'),
            coupon: applied ? applied.code : '',
            items: ls.map(function (l) { return { pid: l.p.id, qty: l.i.qty, variant: optTxt(l.i.opts) }; })
          }).then(function (res) {
            K.cart.clear(s.slug); K.updateCartCount();
            var od = res.order || {};
            showPlaced({ id: res.code, items: (od.items && od.items.length) ? od.items : itemsOut, delivery: od.delivery != null ? od.delivery : m.fee, total: od.total != null ? od.total : m.total, payment: payLabel });
          }).catch(function (ex) { restore(); K.toast(ex.message || 'Could not place your order. Please try again.'); });
        } else {
          var n = 10453 + K.newOrders.get().length;
          K.newOrders.add({ id: 'ORD-' + n, business: s.slug, date: D.today, customer: v('fn'), phone: v('ph'), city: method === 'pickup' ? 'Pickup' : v('ct'), address: v('ad'), items: itemsOut, subtotal: m.sub, delivery: m.fee, total: m.total, status: 'PENDING', payment: payLabel, note: v('nt') });
          K.cart.clear(s.slug); K.updateCartCount();
          showPlaced({ id: 'ORD-' + n, items: itemsOut, delivery: m.fee, total: m.total, payment: payLabel });
        }
      });

      function showPlaced(order) {
        var msg = 'Hello ' + s.name + ', I placed order ' + order.id + ' (' + K.rs(order.total) + ').' + (pay === 'bank' ? ' I am sending the payment slip.' : '');
        main.innerHTML = '<div class="stack-lg" style="max-width:560px;margin:0 auto;padding:48px 0" role="status"><div class="kd-banner kd-banner--success"><div><p class="kd-banner__title">Order placed</p><p style="margin-top:4px">Your order number is <strong class="price-sm">' + K.esc(order.id) + '</strong>. ' + K.esc(s.name) + ' will confirm it shortly.</p></div></div>' +
          '<div class="kd-card panel"><h2 class="heading">Summary</h2><ul class="list">' + order.items.map(function (i) { return '<li><span>' + i.qty + ' &times; ' + K.esc(i.name) + '</span><span class="price-sm">' + K.rs(i.qty * i.price) + '</span></li>'; }).join('') + '</ul><div class="totals"><div><span>Delivery</span><span class="price-sm">' + (order.delivery ? K.rs(order.delivery) : 'Free') + '</span></div><div class="grand"><span>Total</span><span class="price">' + K.rs(order.total) + '</span></div></div><p class="muted">' + K.esc(order.payment) + (pay === 'bank' ? '. Send the amount to ' + K.esc(s.bank) + '.' : '.') + '</p></div>' +
          '<div class="row"><a class="kd-btn kd-btn--primary" href="' + K.wa(s, msg) + '" target="_blank" rel="noopener">Message the shop on WhatsApp</a><a class="kd-btn kd-btn--ghost" href="' + K.sUrl('index') + '">Keep shopping</a></div></div>';
        main.focus(); window.scrollTo({ top: 0 });
      }
      view();
      });
    })();
  </script>
</body>
</html>
