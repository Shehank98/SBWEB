<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store</title>
  <meta name="description" content="Shop online.">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/kade.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to products</a>
  <div id="store-header"></div>
  <main id="main">
    <section class="store-hero"><div class="container"><h1 id="h1"></h1><p id="tag"></p><a class="kd-btn kd-btn--secondary" id="wa" href="#" target="_blank" rel="noopener">Chat on WhatsApp</a></div></section>
    <div class="container">
      <div class="store-tools">
        <div class="chips" id="chips" role="group" aria-label="Categories"></div>
        <div class="row">
          <label class="visually-hidden" for="q">Search products</label><input class="kd-input" id="q" type="search" placeholder="Search products" autocomplete="off">
          <label class="visually-hidden" for="sort">Sort by</label><select class="kd-select" id="sort"><option value="">Featured</option><option value="asc">Price: low to high</option><option value="desc">Price: high to low</option></select>
        </div>
      </div>
      <p class="muted" id="count" role="status" aria-live="polite" style="margin-bottom:12px"></p>
      <div class="product-grid" id="grid"></div>
    </div>
  </main>
  <div id="store-footer"></div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/store.js"></script>
  <script>
    (function () {
      var K = Kade, D = KadeData, s = K.storeInit({ cartBar: true }); if (!s) return;
      K.$('#h1').textContent = s.name; K.$('#tag').textContent = s.tagline;
      K.$('#wa').href = K.wa(s, 'Hello ' + s.name + ', I have a question about your products.');
      var list = D.products.filter(function (p) { return p.store === s.slug; });
      var cat = 'All', q = '';
      var cats = ['All'].concat(s.categories.filter(function (c) { return list.some(function (p) { return p.category === c; }); }));
      function chips() { K.$('#chips').innerHTML = cats.map(function (c) { return '<button type="button" class="kd-chip" aria-pressed="' + (c === cat) + '" data-c="' + K.esc(c) + '">' + K.esc(c) + '</button>'; }).join(''); }
      function card(p) {
        var out = p.stock <= 0, low = !out && p.stock <= p.lowAt, opts = Object.keys(p.options || {}).length > 0;
        var href = K.sUrl('product.html', '&p=' + p.id);
        var action = out ? '<button class="kd-btn kd-btn--secondary kd-btn--block" disabled>Sold out</button>'
          : opts ? '<a class="kd-btn kd-btn--accent kd-btn--block" href="' + href + '">Choose options</a>'
          : '<button class="kd-btn kd-btn--accent kd-btn--block" data-add="' + p.id + '">Add to cart</button>';
        return '<article class="kd-card kd-product"><a class="product-link" href="' + href + '"><div class="kd-product__media">' + K.ph(p) + (p.sale ? '<span class="kd-tag">Sale</span>' : '') + '</div>' +
          '<div class="kd-product__body"><h2 class="kd-product__name">' + K.esc(p.name) + '</h2><p class="kd-product__meta">' + (out ? '<span class="kd-badge kd-badge--danger">Out of stock</span>' : low ? '<span class="kd-badge kd-badge--warning">Only ' + p.stock + ' left</span>' : K.esc(p.category)) + '</p>' + K.priceHtml(p) + '</div></a><div class="kd-product__foot">' + action + '</div></article>';
      }
      function render() {
        var items = list.filter(function (p) { return (cat === 'All' || p.category === cat) && (!q || (p.name + ' ' + p.category).toLowerCase().indexOf(q) >= 0); });
        var sort = K.$('#sort').value;
        if (sort) items.sort(function (a, b) { return (K.priceOf(a) - K.priceOf(b)) * (sort === 'asc' ? 1 : -1); });
        K.$('#count').textContent = items.length + (items.length === 1 ? ' product' : ' products');
        K.$('#grid').innerHTML = items.length ? items.map(card).join('') : '<div class="empty" style="grid-column:1/-1"><h2>Nothing matches your search</h2><p class="muted">Try another word or choose All.</p><button class="kd-btn kd-btn--secondary" id="reset">Clear search</button></div>';
        var r = K.$('#reset'); if (r) r.addEventListener('click', function () { q = ''; cat = 'All'; K.$('#q').value = ''; chips(); render(); });
      }
      K.$('#chips').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; cat = b.getAttribute('data-c'); chips(); render(); K.$('[aria-pressed=true]', K.$('#chips')).focus(); });
      K.$('#q').addEventListener('input', function () { q = this.value.trim().toLowerCase(); render(); });
      K.$('#sort').addEventListener('change', render);
      K.$('#grid').addEventListener('click', function (e) {
        var b = e.target.closest('[data-add]'); if (!b) return;
        K.cart.add(s.slug, { pid: b.getAttribute('data-add'), opts: {}, qty: 1 }); K.updateCartCount(); K.toast('Added to your cart');
      });
      chips(); render();
    })();
  </script>
</body>
</html>
