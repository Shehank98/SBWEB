<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Kade</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/kade.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="container"><a class="wordmark" href="index" aria-label="Kade home">Kade</a><nav class="site-nav" aria-label="Main"><a class="kd-btn kd-btn--secondary" href="register">Open my shop</a></nav></div></header>
  <main id="main" class="auth">
    <div class="stack-lg" style="width:100%;max-width:480px">
      <div class="kd-card auth__card">
        <h1>Log in</h1>
        <form id="form" class="stack-lg" style="margin-top:24px" novalidate>
          <div class="kd-field"><label class="kd-label" for="email">Email</label><input class="kd-input" id="email" type="email" autocomplete="email" required></div>
          <div class="kd-field"><label class="kd-label" for="pw">Password</label><input class="kd-input" id="pw" type="password" autocomplete="current-password" required></div>
          <div class="kd-error" id="err" role="alert" hidden></div>
          <button class="kd-btn kd-btn--primary kd-btn--block" type="submit">Log in</button>
        </form>
        <p class="muted" style="margin-top:16px">New here? <a class="kd-link" href="register">Open your shop</a></p>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var em = document.getElementById('email'), pw = document.getElementById('pw'), err = document.getElementById('err');
      err.hidden = true;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value) || !pw.value) {
        err.hidden = false; err.textContent = 'Enter your email and password.'; (em.value ? pw : em).focus(); return;
      }
      // Authentication is server-side only: the API verifies the password and issues
      // a token. There is no client-side shortcut.
      var btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.innerHTML = '<span class="kd-spinner"></span> Signing in…';
      try {
        var user = await KadeApi.login(em.value.trim(), pw.value);
        location.href = user.role === 'SUPER_ADMIN' ? 'admin/index' : 'dashboard/index';
      } catch (ex) {
        err.hidden = false; err.textContent = ex.message || 'Could not sign in.';
        btn.disabled = false; btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
