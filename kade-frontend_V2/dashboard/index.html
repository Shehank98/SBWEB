<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview | Kade dashboard</title>
  <meta name="robots" content="noindex">
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/kade.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div>
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main" tabindex="-1">

        <div class="page-head"><div><h1 id="hello">Hello</h1><p id="lede">Here is how your store is doing today.</p></div><a class="kd-btn kd-btn--primary" href="products?new=1">Add product</a></div>
        <div id="sub-banner"></div>
        <div class="tiles" id="tiles"></div>
        <div class="grid-2">
          <section class="kd-card panel" aria-labelledby="c1"><h2 id="c1">Sales, last 7 days</h2><div id="chart"></div></section>
          <section class="kd-card panel" aria-labelledby="c2"><h2 id="c2">Needs your attention</h2><div id="attention"></div></section>
        </div>
        <section class="kd-card" aria-labelledby="c3">
          <div class="row row--between" style="padding:16px 16px 0"><h2 class="heading" id="c3">Recent orders</h2><a class="kd-link" href="orders">See all orders</a></div>
          <div class="table-wrap"><table class="kd-table"><thead><tr><th scope="col">Order</th><th scope="col">Customer</th><th scope="col">Status</th><th scope="col" class="kd-num">Total</th></tr></thead><tbody id="recent"></tbody></table></div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var K = Kade, D = KadeData;
      if (!K.guard('owner')) return;
      K.shell('dashboard', 'index');
      var API = !!(window.KadeApi && KadeApi.enabled);
      var sess = API ? KadeApi.currentUser() : null;

      function render(ctx) {
        var orders = ctx.orders, products = ctx.products;
        var h = new Date().getHours();
        K.$('#hello').textContent = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', ' + ctx.firstName;
        K.$('#lede').textContent = 'Here is how ' + ctx.storeName + ' is doing today.';
        var days = ctx.expiry ? K.daysUntil(ctx.expiry) : 999;
        if (days <= 14) {
          K.$('#sub-banner').innerHTML = '<div class="kd-banner kd-banner--' + (days <= 3 ? 'danger' : 'warning') + '"><div><p class="kd-banner__title">Your ' + K.esc(ctx.plan) + ' plan ends in ' + days + ' days</p><p style="margin-top:4px">Renew before ' + K.fmtDate(ctx.expiry) + ' so your store stays open for customers.</p></div><a class="kd-btn kd-btn--primary" href="subscription">Renew now</a></div>';
        }
        var todays = orders.filter(function (o) { return o.date === ctx.today && o.status !== 'CANCELLED'; });
        var sales = ctx.todaySales != null ? ctx.todaySales : todays.reduce(function (n, o) { return n + o.total; }, 0);
        var todayCount = ctx.todayOrders != null ? ctx.todayOrders : todays.length;
        var low = products.filter(function (p) { return p.stock <= p.lowAt; });
        var limitTxt = ctx.maxProducts == null ? 'Unlimited on your ' + K.esc(ctx.plan || '') + ' plan' : (ctx.plan + ' plan allows ' + ctx.maxProducts);
        var tiles = [
          ['Sales today', K.rs(sales), todayCount + ' order' + (todayCount === 1 ? '' : 's') + ' since midnight'],
          ['Orders to handle', orders.filter(function (o) { return o.status === 'PENDING'; }).length, 'Waiting for you to confirm'],
          ['Products', products.length, limitTxt],
          ['Low or out of stock', low.length, low.length ? 'Restock soon' : 'All stocked']
        ];
        K.$('#tiles').innerHTML = tiles.map(function (t) { return '<div class="kd-card stat"><span class="stat__label">' + t[0] + '</span><span class="stat__value">' + t[1] + '</span><span class="stat__delta">' + t[2] + '</span></div>'; }).join('');
        var data = ctx.sales7.map(function (d) { var dt = new Date(d.date + 'T00:00:00'); return { label: dt.toLocaleDateString('en-GB', { weekday: 'short' }), title: dt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' }), value: d.value }; });
        K.bars(K.$('#chart'), data, { label: 'Sales per day for the last 7 days, in rupees', xLabel: 'Day', yLabel: 'Sales' });
        var pend = orders.filter(function (o) { return o.status === 'PENDING'; }).slice(0, 4);
        K.$('#attention').innerHTML = '<ul class="list">' + pend.map(function (o) { return '<li><span><a class="kd-link" href="orders?o=' + o.id + '">#' + o.id + '</a><span class="sub muted" style="display:block;font-size:13px">' + K.esc(o.customer) + ', ' + K.rs(o.total) + '</span></span>' + K.badge('order', 'PENDING') + '</li>'; }).join('') +
          low.slice(0, 3).map(function (p) { return '<li><span><a class="kd-link" href="products?q=' + encodeURIComponent(p.name) + '">' + K.esc(p.name) + '</a><span class="sub muted" style="display:block;font-size:13px">' + p.stock + ' left</span></span>' + K.stockBadge(p) + '</li>'; }).join('') + '</ul>' + (pend.length + low.length ? '' : '<p class="muted">Nothing needs attention right now.</p>');
        K.$('#recent').innerHTML = orders.slice(0, 6).map(function (o) { return '<tr><td><a class="kd-link" href="orders?o=' + o.id + '">#' + o.id + '</a></td><td>' + K.esc(o.customer) + '<span class="sub">' + K.fmtDate(o.date) + '</span></td><td>' + K.badge('order', o.status) + '</td><td class="kd-num">' + K.rs(o.total) + '</td></tr>'; }).join('') || '<tr><td colspan="4" class="muted" style="padding:16px">No orders yet.</td></tr>';
      }

      if (API) {
        K.loading(K.$('#tiles'), 'Loading your dashboard…');
        Promise.all([KadeApi.overview(), KadeApi.myOrders(), KadeApi.myProducts(), KadeApi.subscription()]).then(function (r) {
          var ov = r[0], ord = r[1].orders, prod = r[2].products, sub = r[3];
          render({
            firstName: (sess && sess.name ? sess.name.split(' ')[0] : 'there'),
            storeName: (sess && sess.storeName) || 'your store',
            orders: ord, products: prod,
            plan: sub.plan && sub.plan.name, maxProducts: sub.plan ? sub.plan.maxProducts : null, expiry: sub.expiryDate,
            sales7: ov.sales7, today: (ov.sales7 && ov.sales7.length) ? ov.sales7[ov.sales7.length - 1].date : D.today,
            todaySales: ov.todaySales, todayOrders: ov.todayOrders
          });
        }).catch(function () { K.$('#tiles').innerHTML = '<p class="muted">Could not load your dashboard. Please refresh.</p>'; });
      } else {
        var me = D.businesses[0], plan = D.plans.filter(function (p) { return p.name === me.plan; })[0];
        render({ firstName: 'Kasun', storeName: me.name, orders: K.orders(), products: D.products.filter(function (p) { return p.store === 'abc-fashion'; }), plan: me.plan, maxProducts: plan ? plan.maxProducts : null, expiry: me.expiry, sales7: D.sales7, today: D.today });
      }
    })();
  </script>
</body>
</html>
