<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Businesses | Kade admin</title>
  <meta name="robots" content="noindex">
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/kade.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div>
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main" tabindex="-1">

        <div class="page-head"><div><h1>Businesses</h1><p>Approve, suspend and extend stores.</p></div></div>
        <div class="toolbar"><label class="visually-hidden" for="q">Search businesses</label><input class="kd-input" id="q" type="search" placeholder="Search by business or owner"><label class="visually-hidden" for="st">Status</label><select class="kd-select" id="st"></select></div>
        <section class="kd-card" aria-label="Businesses"><div class="table-wrap"><table class="kd-table" style="min-width:860px"><thead><tr><th scope="col">Business</th><th scope="col">Plan</th><th scope="col">Status</th><th scope="col">Ends</th><th scope="col" class="kd-num">Orders</th><th scope="col" class="kd-num">Store sales</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead><tbody id="rows"></tbody></table></div><div id="none" class="empty" hidden><h2>No businesses match</h2><p class="muted">Try a different search or status.</p></div></section>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var K = Kade, D = KadeData;
      K.shell('admin', 'businesses');

      function addDays(iso, n) { var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
      function activate(b) { var base = b.expiry && b.expiry > D.today ? b.expiry : D.today; b.expiry = addDays(base, 30); b.status = 'ACTIVE'; }

      var B = D.businesses, q = '', st = 'ALL';
      var STATUSES = ['PENDING_PAYMENT', 'PENDING_APPROVAL', 'ACTIVE', 'EXPIRING', 'GRACE_PERIOD', 'SUSPENDED', 'CANCELLED'];
      K.$('#st').innerHTML = '<option value="ALL">All statuses</option>' + STATUSES.map(function (s) { return '<option value="' + s + '">' + s.replace(/_/g, ' ').toLowerCase().replace(/^./, function (c) { return c.toUpperCase(); }) + '</option>'; }).join('');
      function actions(b) {
        var a = [];
        if (b.status === 'PENDING_APPROVAL') { a.push('<button class="kd-btn kd-btn--primary kd-btn--sm" data-a="approve" data-id="' + b.id + '" aria-label="Approve ' + K.esc(b.name) + '">Approve</button>', '<button class="kd-btn kd-btn--ghost kd-btn--sm" style="color:var(--danger)" data-a="reject" data-id="' + b.id + '" aria-label="Reject ' + K.esc(b.name) + '">Reject</button>'); }
        else if (b.status === 'SUSPENDED') a.push('<button class="kd-btn kd-btn--primary kd-btn--sm" data-a="reactivate" data-id="' + b.id + '" aria-label="Reactivate ' + K.esc(b.name) + '">Reactivate</button>');
        else if (b.status === 'ACTIVE' || b.status === 'EXPIRING' || b.status === 'GRACE_PERIOD') a.push('<button class="kd-btn kd-btn--secondary kd-btn--sm" data-a="extend" data-id="' + b.id + '" aria-label="Extend ' + K.esc(b.name) + ' by 30 days">Extend 30 days</button>', '<button class="kd-btn kd-btn--ghost kd-btn--sm" style="color:var(--danger)" data-a="suspend" data-id="' + b.id + '" aria-label="Suspend ' + K.esc(b.name) + '">Suspend</button>');
        return a.join('');
      }
      function render() {
        var list = B.filter(function (b) { return (st === 'ALL' || b.status === st) && (!q || (b.name + ' ' + b.owner).toLowerCase().indexOf(q) >= 0); });
        K.$('#none').hidden = list.length > 0;
        K.$('#rows').innerHTML = list.map(function (b) { return '<tr><td><strong>' + K.esc(b.name) + '</strong><span class="sub">' + K.esc(b.owner) + ' | Joined ' + K.fmtDate(b.joined) + '</span></td><td>' + K.esc(b.plan) + '</td><td>' + K.badge('sub', b.status) + '</td><td>' + (b.expiry ? K.fmtDate(b.expiry) : 'Not started') + '</td><td class="kd-num">' + b.orders + '</td><td class="kd-num">' + K.rs(b.revenue) + '</td><td><div class="actions">' + actions(b) + '</div></td></tr>'; }).join('');
      }
      K.$('#q').addEventListener('input', function () { q = this.value.trim().toLowerCase(); render(); });
      K.$('#st').addEventListener('change', function () { st = this.value; render(); });
      K.$('#rows').addEventListener('click', function (e) {
        var btn = e.target.closest('button'); if (!btn) return; var b = B.filter(function (x) { return x.id === btn.getAttribute('data-id'); })[0], a = btn.getAttribute('data-a');
        if (a === 'approve') { activate(b); render(); K.toast(b.name + ' approved. The "store is ready" email is queued.'); }
        else if (a === 'reactivate') { activate(b); render(); K.toast(b.name + ' is open again for 30 days.'); }
        else if (a === 'extend') { b.expiry = addDays(b.expiry > D.today ? b.expiry : D.today, 30); b.status = 'ACTIVE'; render(); K.toast(b.name + ' extended to ' + K.fmtDate(b.expiry) + '.'); }
        else if (a === 'suspend') K.confirm({ title: 'Suspend ' + b.name + '?', body: 'Their store will show as temporarily unavailable. Products and orders are kept and come back when you reactivate.', confirmLabel: 'Suspend store', danger: true }).then(function (ok) { if (ok) { b.status = 'SUSPENDED'; render(); K.toast(b.name + ' suspended.'); } });
        else if (a === 'reject') K.confirm({ title: 'Reject ' + b.name + '?', body: 'The owner gets an email with your reason.', confirmLabel: 'Reject application', danger: true, reason: 'Reason for the owner' }).then(function (r) { if (r) { b.status = 'CANCELLED'; render(); K.toast('Application rejected. Email queued.'); } });
      });
      render();

    })();
  </script>
</body>
</html>
