<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments | Kade admin</title>
  <meta name="robots" content="noindex">
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/kade.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div>
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main" tabindex="-1">

        <div class="page-head"><div><h1>Payments</h1><p>Check payment slips before you activate or renew a store.</p></div></div>
        <div class="kd-tabs" role="tablist" aria-label="Payment status" id="tabs"></div>
        <div class="pay-grid" id="grid"></div>
        <div id="none" class="empty kd-card" hidden><h2>Nothing here</h2><p class="muted">Payments in this state will show up here.</p></div>
      </main>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var K = Kade, D = KadeData;
      K.shell('admin', 'payments');

      function addDays(iso, n) { var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
      function activate(b) { var base = b.expiry && b.expiry > D.today ? b.expiry : D.today; b.expiry = addDays(base, 30); b.status = 'ACTIVE'; }

      var P = D.payments, tab = 'PENDING', LABEL = { PENDING: 'Pending', APPROVED: 'Approved', REJECTED: 'Rejected' };
      function tabs() { K.$('#tabs').innerHTML = Object.keys(LABEL).map(function (s) { return '<button class="kd-tab" role="tab" type="button" data-s="' + s + '" aria-selected="' + (s === tab) + '">' + LABEL[s] + '<span class="count">' + P.filter(function (p) { return p.status === s; }).length + '</span></button>'; }).join(''); }
      function render() {
        var list = P.filter(function (p) { return p.status === tab; }); K.$('#none').hidden = list.length > 0;
        K.$('#grid').innerHTML = list.map(function (p) {
          return '<article class="kd-card panel"><div class="row row--between"><h2 class="heading">' + K.esc(p.business) + '</h2>' + K.badge('pay', p.status) + '</div>' +
            '<dl class="dl"><dt>Owner</dt><dd>' + K.esc(p.owner) + '</dd><dt>Plan</dt><dd>' + K.esc(p.plan) + '</dd><dt>Amount</dt><dd class="price-sm">' + K.rs(p.amount) + '</dd><dt>Reference</dt><dd>' + K.esc(p.ref || 'None') + '</dd><dt>Submitted</dt><dd>' + K.fmtDate(p.submitted) + '</dd>' + (p.reason ? '<dt>Reason</dt><dd>' + K.esc(p.reason) + '</dd>' : '') + '</dl>' +
            '<div class="slip" role="img" aria-label="Payment slip image for ' + K.esc(p.business) + '">Payment slip image<br>(uploaded by the owner)</div>' +
            (p.status === 'PENDING' ? '<div class="row"><button class="kd-btn kd-btn--primary" data-a="ok" data-id="' + p.id + '" aria-label="Approve payment from ' + K.esc(p.business) + '">Approve</button><button class="kd-btn kd-btn--ghost" style="color:var(--danger)" data-a="no" data-id="' + p.id + '" aria-label="Reject payment from ' + K.esc(p.business) + '">Reject</button></div>' : '') + '</article>';
        }).join('');
      }
      K.$('#tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { tab = b.getAttribute('data-s'); tabs(); render(); K.$('[aria-selected=true]', K.$('#tabs')).focus(); } });
      K.$('#grid').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return; var p = P.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
        if (b.getAttribute('data-a') === 'ok') {
          p.status = 'APPROVED'; var biz = D.businesses.filter(function (x) { return x.name === p.business; })[0]; if (biz) activate(biz);
          tabs(); render(); K.toast(p.business + ' is active until ' + (biz ? K.fmtDate(biz.expiry) : '') + '. Email queued.');
        } else K.confirm({ title: 'Reject this payment?', body: p.business + ' will be asked to send a new slip.', confirmLabel: 'Reject payment', danger: true, reason: 'Reason for the owner' }).then(function (r) { if (r) { p.status = 'REJECTED'; p.reason = r.reason; tabs(); render(); K.toast('Payment rejected. Email queued.'); } });
      });
      tabs(); render();

    })();
  </script>
</body>
</html>
