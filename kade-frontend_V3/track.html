<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7F0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Track your order</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/storefront.css">
</head>
<body>
  <a class="sf-skip" href="#main">Skip to your order</a>
  <div id="sf-header"></div>
  <main id="main" class="wrap" tabindex="-1">
    <div class="trk"><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:280px"></div></div>
  </main>
  <div id="sf-footer"></div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/store.js"></script>
  <script>
    /* Public order tracking: /track/<order code>?k=<private token>. No login. */
    (function () {
      var K = Kade, rs = SF.rs, ic = SF.ic, main = document.getElementById('main');
      var code = decodeURIComponent(location.pathname.replace(/^\/track\//, '').replace(/\/$/, ''));
      var key = new URLSearchParams(location.search).get('k') || '';
      function when(t) { if (!t) return ''; var d = new Date(t); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
      function problem(title, text, retry) {
        main.innerHTML = '<div class="trk"><div class="panel empty"><div class="big" aria-hidden="true">🔎</div><h1>' + title + '</h1><p style="color:var(--sf-muted)">' + text + '</p>' +
          (retry ? '<button type="button" class="btn btn-soft btn-sm" id="retry">Try again</button>' : '') + '</div></div>';
        var r = document.getElementById('retry'); if (r) r.addEventListener('click', function () { load(); });
      }
      if (!code || !/^[a-f0-9]{16,64}$/.test(key)) { problem('This tracking link is not complete', 'Open the "Track your order" button in your order email, or ask the shop to send the link again.'); return; }

      function paint(r) {
        var o = r.order, s = r.store || { name: 'Shop' }, tl = r.timeline || [];
        if (r.store) SF.chrome(r.store, { noCart: true });
        document.title = 'Order ' + o.code + ' | ' + s.name;
        var cancelled = tl.some(function (t) { return t.key === 'CANCELLED'; });
        var cur = tl.filter(function (t) { return t.done; }).pop() || tl[0];
        var line = '<ol class="tl" aria-label="Order progress">' + tl.map(function (t) {
          var isCur = t === cur, extra = '';
          if (t.key === 'SHIPPED' && t.done && o.tracking && o.tracking.number) {
            extra = '<div class="tl-extra">' + K.esc(o.tracking.courier || 'Courier') + ' · <b>' + K.esc(o.tracking.number) + '</b>' +
              (o.tracking.url ? ' <a href="' + K.esc(o.tracking.url) + '" target="_blank" rel="noopener">Track parcel</a>' : '') + '</div>';
          }
          return '<li class="' + (t.done ? 'done' : '') + (isCur ? ' cur' : '') + (t.key === 'CANCELLED' ? ' bad' : '') + '"' + (isCur ? ' aria-current="step"' : '') + '>' +
            '<span class="tl-dot" aria-hidden="true">' + (t.key === 'CANCELLED' ? '✕' : t.done ? '✓' : '') + '</span>' +
            '<div><b>' + K.esc(t.label) + '</b>' + (t.at ? '<small>' + when(t.at) + '</small>' : (t.done ? '' : '<small>Not yet</small>')) + extra + '</div></li>';
        }).join('') + '</ol>';
        main.innerHTML = '<div class="trk">' +
          '<section class="panel trk-head"><p class="trk-shop">' + K.esc(s.name) + '</p><h1>Order ' + K.esc(o.code) + '</h1>' +
          '<p class="trk-status' + (cancelled ? ' bad' : '') + '">' + K.esc(cur ? cur.label : 'Placed') + '</p>' +
          '<p style="color:var(--sf-muted);font-size:14px">Placed ' + when((tl[0] && tl[0].at) || o.date) + ' · ' + K.esc(o.payment || '') + '</p></section>' +
          '<section class="panel"><h2>Progress</h2>' + line + '</section>' +
          '<section class="panel"><h2>Summary</h2><ul class="mini">' + o.items.map(function (i) { return '<li><span class="mini-img">' + (i.image ? SF.img(i.image, '', true) : '<span class="ph">' + K.esc(K.initials(i.name)) + '</span>') + '<b>' + i.qty + '</b></span><span class="mini-n">' + K.esc(i.name) + '</span><span>' + rs(i.qty * i.price) + '</span></li>'; }).join('') + '</ul>' +
          '<div class="rows" style="margin-bottom:0"><div><span>Subtotal</span><span>' + rs(o.subtotal) + '</span></div>' + (o.discount ? '<div class="disc"><span>Discount</span><span>− ' + rs(o.discount) + '</span></div>' : '') +
          '<div><span>Delivery</span><span>' + (o.delivery ? rs(o.delivery) : 'Free') + '</span></div><div class="grand"><span>Total</span><span>' + rs(o.total) + '</span></div></div></section>' +
          deliveredBox(r) + reviewBox(r) +
          '<div class="trk-actions">' +
          (r.receiptUrl ? '<a class="btn btn-soft btn-sm" href="' + K.esc(r.receiptUrl) + '">' + ic('list', 'ic-sm') + 'View receipt</a>' : '') +
          (s.whatsapp ? '<a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="' + K.wa(s, 'Hello ' + s.name + ', I have a question about my order ' + o.code + '.') + '">WhatsApp the shop</a>' : '') +
          (s.slug ? '<a class="btn btn-ghost btn-sm" href="/store/' + encodeURIComponent(s.slug) + '">Back to shop</a>' : '') +
          '</div></div>';
      }
      /* ---------- The buyer confirms delivery, then reviews (if the shop has reviews on) ---------- */
      function deliveredBox(r) {
        if (!r.canConfirmDelivery) return '';
        return '<section class="panel trk-got"><h2>Got your parcel?</h2><p style="color:var(--sf-muted);font-size:14px;margin-bottom:12px">Let ' + K.esc((r.store || {}).name || 'the shop') + ' know it arrived safely.</p>' +
          '<button type="button" class="btn btn-primary btn-sm" data-act="delivered">I received my order</button></section>';
      }
      var stars = {};
      function reviewBox(r) {
        var o = r.order;
        if (o.status !== 'DELIVERED' || !r.reviewsEnabled) return '';
        var todo = o.items.filter(function (i) { return i.productId && !i.reviewed; });
        if (!todo.length) return o.items.some(function (i) { return i.reviewed; }) ? '<section class="panel trk-rv"><h2>Thank you for your review</h2><p style="color:var(--sf-muted);font-size:14px">It helps other buyers and the shop.</p></section>' : '';
        return '<section class="panel trk-rv" id="rvBox"><h2>How was your order?</h2><p style="color:var(--sf-muted);font-size:14px;margin-bottom:10px">Rate what you bought. Your first name is shown with your review.</p>' +
          todo.map(function (i) {
            return '<fieldset class="rv-item"><legend>' + K.esc(i.name) + '</legend><div class="rv-stars" role="radiogroup" aria-label="Rating for ' + K.esc(i.name) + '">' +
              [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" class="rv-star" role="radio" aria-checked="' + (stars[i.productId] === n) + '" aria-label="' + n + ' star' + (n > 1 ? 's' : '') + '" data-pid="' + K.esc(i.productId) + '" data-n="' + n + '">' + (stars[i.productId] >= n ? '★' : '☆') + '</button>'; }).join('') +
              '</div><textarea class="input rv-text" data-pid="' + K.esc(i.productId) + '" rows="2" maxlength="1000" placeholder="What did you like? (optional)"></textarea></fieldset>';
          }).join('') +
          '<p class="err" id="rvErr" hidden></p><button type="button" class="btn btn-primary btn-sm" data-act="review">Send review</button></section>';
      }
      var busy = false, lastJson = '', editing = false;
      main.addEventListener('focusin', function (e) { if (e.target.closest('.trk-rv')) editing = true; });
      main.addEventListener('click', function (e) {
        var b = e.target.closest('[data-act], .rv-star'); if (!b || busy) return;
        if (b.classList.contains('rv-star')) {
          editing = true; stars[b.getAttribute('data-pid')] = +b.getAttribute('data-n');
          K.$$('.rv-star[data-pid="' + b.getAttribute('data-pid') + '"]').forEach(function (x) { var n = +x.getAttribute('data-n'); x.textContent = n <= stars[b.getAttribute('data-pid')] ? '★' : '☆'; x.setAttribute('aria-checked', String(n === stars[b.getAttribute('data-pid')])); });
          return;
        }
        var act = b.getAttribute('data-act');
        if (act === 'delivered') {
          if (!window.confirm('Confirm that you received this order?')) return;
          busy = true; b.disabled = true; b.textContent = 'Saving…';
          post('/delivered', {}).then(function () { busy = false; SF.toast('Thank you! Marked as delivered.'); load(true, true); })
            .catch(function (m) { busy = false; b.disabled = false; b.textContent = 'I received my order'; SF.toast(m); });
        } else if (act === 'review') {
          var list = Object.keys(stars).map(function (pid) { var t = K.$('.rv-text[data-pid="' + pid + '"]'); return { productId: pid, rating: stars[pid], body: t ? t.value : '' }; });
          var err = K.$('#rvErr');
          if (!list.length) { err.hidden = false; err.textContent = 'Tap the stars to rate at least one product.'; return; }
          busy = true; b.disabled = true; b.textContent = 'Sending…';
          post('/reviews', { reviews: list }).then(function () { busy = false; editing = false; stars = {}; SF.toast('Thank you for your review!'); load(true, true); })
            .catch(function (m) { busy = false; b.disabled = false; b.textContent = 'Send review'; err.hidden = false; err.textContent = m; });
        }
      });
      function post(path, body) {
        return fetch('/api/track/' + encodeURIComponent(code) + path + '?k=' + encodeURIComponent(key), { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body) })
          .then(function (res) { return res.json().catch(function () { return {}; }).then(function (j) { if (!res.ok) throw (j.error || 'Something went wrong. Please try again.'); return j; }); });
      }
      /* Refresh every 10 seconds while the page is open, so status changes appear
         without a reload. Paused while the buyer is writing a review or the tab is hidden. */
      function load(silent, force) {
        if (!silent) main.innerHTML = '<div class="trk"><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:280px"></div></div>';
        return fetch('/api/track/' + encodeURIComponent(code) + '?k=' + encodeURIComponent(key), { headers: { Accept: 'application/json' }, cache: 'no-store' })
          .then(function (res) { if (res.status === 404) throw { notFound: true }; if (!res.ok) throw {}; return res.json(); })
          .then(function (r) {
            var j = JSON.stringify(r);
            if (silent && !force && (j === lastJson || editing)) return;
            lastJson = j; paint(r);
          })
          .catch(function (e) {
            if (silent) return; // keep showing the last good view; the next tick retries
            if (e && e.notFound) problem('We could not find this order', 'Check the link in your order email. If it still does not work, contact the shop.');
            else problem('Could not load your order', 'Please check your connection and try again.', true);
          });
      }
      setInterval(function () { if (!document.hidden && !busy) load(true); }, 10000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) load(true); });
      load();
    })();
  </script>
</body>
</html>
