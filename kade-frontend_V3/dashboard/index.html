<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview | Sidadiya dashboard</title>
  <meta name="robots" content="noindex">
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/kade.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div>
      <header class="topbar" id="topbar"></header>
      <main class="main" id="main" tabindex="-1">

        <div class="page-head"><div><h1 id="hello">Hello</h1><p id="lede">Here is how your store is doing today.</p></div><a class="kd-btn kd-btn--primary" href="products?new=1">Add product</a></div>
        <div id="sub-banner"></div>
        <div id="setup-card"></div>
        <div id="compliance-card"></div>
        <div class="tiles" id="tiles"></div>
        <div class="grid-2">
          <section class="kd-card panel" aria-labelledby="c1"><h2 id="c1">Sales, last 7 days</h2><div id="chart"></div></section>
          <section class="kd-card panel" aria-labelledby="c2"><h2 id="c2">Needs your attention</h2><div id="attention"></div></section>
        </div>
        <section class="kd-card panel vs" aria-labelledby="c4" style="margin-bottom:var(--space-4)">
          <div class="vs-head"><h2 id="c4">Where visitors came from</h2>
            <div class="vs-range" role="group" aria-label="Date range">
              <button type="button" class="kd-chip" data-days="7" aria-pressed="true">7 days</button><button type="button" class="kd-chip" data-days="30" aria-pressed="false">30 days</button><button type="button" class="kd-chip" data-days="90" aria-pressed="false">90 days</button><button type="button" class="kd-chip" data-days="custom" aria-pressed="false">Custom</button>
            </div>
          </div>
          <form class="vs-custom" id="vsCustom" hidden novalidate><label class="kd-label" for="vsFrom">From</label><input class="kd-input" type="date" id="vsFrom"><label class="kd-label" for="vsTo">To</label><input class="kd-input" type="date" id="vsTo"><button class="kd-btn kd-btn--secondary kd-btn--sm" type="submit">Apply</button></form>
          <div id="traffic" aria-live="polite"></div>
        </section>
        <section class="kd-card" aria-labelledby="c3">
          <div class="row row--between" style="padding:16px 16px 0"><h2 class="heading" id="c3">Recent orders</h2><a class="kd-link" href="orders">See all orders</a></div>
          <div class="table-wrap"><table class="kd-table"><thead><tr><th scope="col">Order</th><th scope="col">Customer</th><th scope="col">Status</th><th scope="col" class="kd-num">Total</th></tr></thead><tbody id="recent"></tbody></table></div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/demo.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var K = Kade, D = KadeData;
      if (!K.guard('owner')) return;
      K.shell('dashboard', 'index');
      var API = !!(window.KadeApi && KadeApi.enabled);
      var sess = API ? KadeApi.currentUser() : null;

      function render(ctx) {
        var orders = ctx.orders, products = ctx.products;
        var h = new Date().getHours();
        K.$('#hello').textContent = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', ' + ctx.firstName;
        K.$('#lede').textContent = 'Here is how ' + ctx.storeName + ' is doing today.';
        var days = ctx.expiry ? K.daysUntil(ctx.expiry) : 999;
        // During the free trial the shell shows the trial countdown instead.
        if (days <= 14 && !ctx.onTrial) {
          K.$('#sub-banner').innerHTML = '<div class="kd-banner kd-banner--' + (days <= 3 ? 'danger' : 'warning') + '"><div><p class="kd-banner__title">Your ' + K.esc(ctx.plan) + ' plan ends in ' + days + ' days</p><p style="margin-top:4px">Renew before ' + K.fmtDate(ctx.expiry) + ' so your store stays open for customers.</p></div><a class="kd-btn kd-btn--primary" href="subscription">Renew now</a></div>';
        }
        var todays = orders.filter(function (o) { return o.date === ctx.today && o.status !== 'CANCELLED'; });
        var sales = ctx.todaySales != null ? ctx.todaySales : todays.reduce(function (n, o) { return n + o.total; }, 0);
        var todayCount = ctx.todayOrders != null ? ctx.todayOrders : todays.length;
        var low = products.filter(function (p) { return p.stock <= p.lowAt; });
        var limitTxt = ctx.maxProducts == null ? 'Unlimited on your ' + K.esc(ctx.plan || '') + ' plan' : (ctx.plan + ' plan allows ' + ctx.maxProducts);
        var tiles = [
          ['Sales today', K.rs(sales), todayCount + ' order' + (todayCount === 1 ? '' : 's') + ' since midnight'],
          ['Orders to handle', orders.filter(function (o) { return o.status === 'PENDING'; }).length, 'Waiting for you to confirm'],
          ['Products', products.length, limitTxt],
          ['Low or out of stock', low.length, low.length ? 'Restock soon' : 'All stocked']
        ];
        K.$('#tiles').innerHTML = tiles.map(function (t) { return '<div class="kd-card stat"><span class="stat__label">' + t[0] + '</span><span class="stat__value">' + t[1] + '</span><span class="stat__delta">' + t[2] + '</span></div>'; }).join('');
        var data = ctx.sales7.map(function (d) { var dt = new Date(d.date + 'T00:00:00'); return { label: dt.toLocaleDateString('en-GB', { weekday: 'short' }), title: dt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' }), value: d.value }; });
        K.bars(K.$('#chart'), data, { label: 'Sales per day for the last 7 days, in rupees', xLabel: 'Day', yLabel: 'Sales' });
        var pend = orders.filter(function (o) { return o.status === 'PENDING'; }).slice(0, 4);
        K.$('#attention').innerHTML = '<ul class="list">' + pend.map(function (o) { return '<li><span><a class="kd-link" href="orders?o=' + o.id + '">#' + o.id + '</a><span class="sub muted" style="display:block;font-size:13px">' + K.esc(o.customer) + ', ' + K.rs(o.total) + '</span></span>' + K.badge('order', 'PENDING') + '</li>'; }).join('') +
          low.slice(0, 3).map(function (p) { return '<li><span><a class="kd-link" href="products?q=' + encodeURIComponent(p.name) + '">' + K.esc(p.name) + '</a><span class="sub muted" style="display:block;font-size:13px">' + p.stock + ' left</span></span>' + K.stockBadge(p) + '</li>'; }).join('') + '</ul>' + (pend.length + low.length ? '' : '<p class="muted">Nothing needs attention right now.</p>');
        K.$('#recent').innerHTML = orders.slice(0, 6).map(function (o) { return '<tr><td><a class="kd-link" href="orders?o=' + o.id + '">#' + o.id + '</a></td><td>' + K.esc(o.customer) + '<span class="sub">' + K.fmtDate(o.date) + '</span></td><td>' + K.badge('order', o.status) + '</td><td class="kd-num">' + K.rs(o.total) + '</td></tr>'; }).join('') || '<tr><td colspan="4" class="muted" style="padding:16px">No orders yet.</td></tr>';
      }

      /* ---------- Where visitors came from ---------- */
      var VS_SAMPLE = [['WhatsApp', 46, 12], ['Facebook', 28, 6], ['Instagram', 14, 3], ['Direct', 7, 2], ['Google', 3, 1], ['TikTok', 2, 0], ['Other', 0, 0]];
      function vsChart(rows, total, sample) {
        var max = Math.max.apply(null, rows.map(function (r) { return r.visitors; }).concat([1]));
        var bars = rows.map(function (r) {
          var tip = r.label + ': ' + r.visitors + ' visitor' + (r.visitors === 1 ? '' : 's') + ' (' + r.pct + '%)' + (r.orders ? ', ' + r.orders + ' order' + (r.orders === 1 ? '' : 's') : '');
          return '<li class="vs-row" title="' + K.esc(tip) + '" tabindex="' + (sample ? -1 : 0) + '" aria-label="' + K.esc(tip) + '"><span class="vs-lbl">' + K.esc(r.label) + '</span>' +
            '<span class="vs-track"><span class="vs-bar" style="width:' + (r.visitors ? Math.max(2, r.visitors / max * 100) : 0) + '%"></span></span><span class="vs-val">' + r.pct + '%</span></li>';
        }).join('');
        var table = '<table class="kd-table vs-table"><caption class="visually-hidden">Visitors and orders by source</caption><thead><tr><th scope="col">Source</th><th scope="col" class="kd-num">Visitors</th><th scope="col" class="kd-num">Share</th><th scope="col" class="kd-num">Orders</th></tr></thead><tbody>' +
          rows.map(function (r) { return '<tr><td>' + K.esc(r.label) + '</td><td class="kd-num">' + r.visitors + '</td><td class="kd-num">' + r.pct + '%</td><td class="kd-num">' + r.orders + '</td></tr>'; }).join('') +
          '</tbody><tfoot><tr><th scope="row">Total</th><td class="kd-num">' + total + '</td><td class="kd-num">' + (total ? '100%' : '0%') + '</td><td class="kd-num">' + rows.reduce(function (n, r) { return n + r.orders; }, 0) + '</td></tr></tfoot></table>';
        return '<div class="vs-body"><ol class="vs-chart" aria-label="Share of visitors by source">' + bars + '</ol><div class="vs-tablewrap">' + table + '</div></div>';
      }
      function vsLocked() {
        var tot = VS_SAMPLE.reduce(function (n, r) { return n + r[1]; }, 0);
        var rows = VS_SAMPLE.map(function (r) { return { label: r[0], visitors: r[1], orders: r[2], pct: Math.round(r[1] / tot * 1000) / 10 }; });
        K.$('#traffic').innerHTML = '<div class="vs-lock"><div class="vs-blur" aria-hidden="true" inert>' + vsChart(rows, tot, true) + '</div>' +
          '<div class="vs-over"><span class="vs-lockic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>' +
          '<p class="vs-over__t">See where your visitors come from</p><p class="vs-over__s">WhatsApp, Facebook, Instagram, Google or TikTok: know which posts bring buyers.</p>' +
          '<a class="kd-btn kd-btn--primary kd-btn--sm" href="subscription">Upgrade to Pro</a></div></div>';
        K.$$('.vs-range button').forEach(function (b) { b.disabled = true; });
      }
      var vsReq = 0;
      function loadTraffic(range) {
        var box = K.$('#traffic'), my = ++vsReq;
        box.innerHTML = '<div class="vs-loading">' + K.spinner() + ' Loading visitor sources…</div>';
        KadeApi.traffic(range.days ? range.days : { from: range.from, to: range.to }).then(function (t) {
          if (my !== vsReq) return;
          if (!t.total) { box.innerHTML = '<div class="empty" style="padding:16px 0"><p class="muted">No visits in this period yet. Share your store link on WhatsApp, Facebook and Instagram.</p></div>'; return; }
          box.innerHTML = vsChart(t.buckets, t.total) + '<p class="kd-help" style="margin-top:10px">' + t.total + ' visitor' + (t.total === 1 ? '' : 's') + ' · ' + t.orders + ' order' + (t.orders === 1 ? '' : 's') + '. Tip: add <code>?utm_source=whatsapp</code> to links you share to track each post.</p>';
        }).catch(function (ex) {
          if (my !== vsReq) return;
          if (ex && ex.status === 403 && ex.details && ex.details.code === 'UPGRADE_REQUIRED') return vsLocked();
          box.innerHTML = '<div class="empty" style="padding:16px 0"><p class="muted">Could not load visitor sources.</p><button class="kd-btn kd-btn--secondary kd-btn--sm" type="button" id="vsRetry">Try again</button></div>';
          K.$('#vsRetry').addEventListener('click', function () { loadTraffic(range); });
        });
      }
      var today = new Date(Date.now() + 5.5 * 3600000).toISOString().slice(0, 10);
      K.$('#vsTo').value = today; K.$('#vsTo').max = today; K.$('#vsFrom').max = today;
      K.$('#vsFrom').value = new Date(Date.now() + 5.5 * 3600000 - 29 * 86400000).toISOString().slice(0, 10);
      K.$('.vs-range').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b || b.disabled) return;
        K.$$('.vs-range button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        var d = b.getAttribute('data-days');
        K.$('#vsCustom').hidden = d !== 'custom';
        if (d !== 'custom') loadTraffic({ days: Number(d) });
      });
      K.$('#vsCustom').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = K.$('#vsFrom').value, t = K.$('#vsTo').value;
        if (!f || !t) return K.toast('Choose both dates.');
        if (f > t) return K.toast('The start date must be before the end date.');
        loadTraffic({ from: f, to: t });
      });

      if (API) {
        K.loading(K.$('#tiles'), 'Loading your dashboard…');
        // Where visitors came from: Pro only. The API refuses other plans (403), and
        // then a blurred sample (made-up numbers, never this shop's data) is shown.
        loadTraffic({ days: 7 });

        // Store setup progress: small card until 100%, then a one-time celebration.
        if (!sess || sess.role !== 'BUSINESS_STAFF') KadeApi.storeSetup().then(function (d) {
          var el = K.$('#setup-card'), seenKey = 'kade-setup-done-' + (d.slug || '');
          if (d.complete) {
            try { if (localStorage.getItem(seenKey)) return; } catch (e) {}
            el.innerHTML = '<section class="kd-card panel sp-card sp-card--done" aria-labelledby="spc-h"><button type="button" class="sp-x" aria-label="Dismiss">×</button>' +
              '<h2 id="spc-h">Your store is fully set up!</h2><p class="muted">Your customers can now:</p><ul class="sp-can sp-can--row">' +
              ['Browse products', 'Add products to cart', 'Place orders', 'Contact your business'].map(function (t, n) { return '<li style="--i:' + n + '"><span class="sp-mark is-done" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span><span>' + t + '</span></li>'; }).join('') +
              '</ul><a class="kd-btn kd-btn--primary" href="../store/' + encodeURIComponent(d.slug) + '" target="_blank" rel="noopener">Open my store</a></section>';
            K.confetti(K.$('.sp-card', el));
            K.$('.sp-x', el).addEventListener('click', function () { try { localStorage.setItem(seenKey, '1'); } catch (e) {} el.innerHTML = ''; });
            return;
          }
          el.innerHTML = '<section class="kd-card panel sp-card" aria-labelledby="spc-h"><div class="sp-card__top"><h2 id="spc-h">Complete your store</h2><span class="sp-card__pct"><b data-count="' + d.percent + '">0</b>%</span></div>' +
            K.setupBar(d.percent) +
            (d.ready ? '<p class="sp-ready sp-ready--sm"><span class="sp-dot"></span>Your store is ready to accept orders</p>' : '') +
            (d.next ? '<p class="sp-card__tip">' + K.esc(d.next.tip) + '</p>' : '') +
            '<div class="row" style="gap:8px;flex-wrap:wrap"><a class="kd-btn kd-btn--primary" href="' + K.esc(d.next ? d.next.href : 'setup') + '">Complete now →</a><a class="kd-btn kd-btn--ghost" href="setup">See all steps</a></div></section>';
          K.animateSetup(el);
        }).catch(function () {});

        // Compliance checklist (policies + contact): shown until all 5 are done.
        var sess = KadeApi.currentUser && KadeApi.currentUser();
        if (!sess || sess.role !== 'BUSINESS_STAFF') KadeApi.compliance().then(function (c) {
          if (c.complete) return;
          K.$('#compliance-card').innerHTML = '<section class="kd-card panel compliance-card" aria-labelledby="cc-h" style="margin-bottom:var(--space-4)"><div class="row row--between"><h2 id="cc-h">Get ready for card payments</h2><span class="kd-badge kd-badge--warning">' + c.doneCount + ' of 5 done</span></div>' +
            '<ul class="checklist">' + c.items.map(function (i) { return '<li class="' + (i.done ? 'is-done' : '') + '"><span class="checklist__mark" aria-hidden="true">' + (i.done ? '✓' : '') + '</span><a href="policies#' + (i.key === 'contact' ? 'contact' : 'pol-' + i.key) + '"><strong>' + K.esc(i.label) + '</strong><small>' + K.esc(i.hint) + '</small></a></li>'; }).join('') + '</ul>' +
            '<a class="kd-btn kd-btn--primary" href="policies">Finish my policies</a></section>';
        }).catch(function () {});
        Promise.all([KadeApi.overview(), KadeApi.myOrders(), KadeApi.myProducts(), KadeApi.subscription()]).then(function (r) {
          var ov = r[0], ord = r[1].orders, prod = r[2].products, sub = r[3];
          render({
            firstName: (sess && sess.name ? sess.name.split(' ')[0] : 'there'),
            storeName: (sess && sess.storeName) || 'your store',
            orders: ord, products: prod,
            plan: sub.plan && sub.plan.name, maxProducts: sub.plan ? sub.plan.maxProducts : null, expiry: sub.expiryDate, onTrial: !!sub.onTrial,
            sales7: ov.sales7, today: (ov.sales7 && ov.sales7.length) ? ov.sales7[ov.sales7.length - 1].date : D.today,
            todaySales: ov.todaySales, todayOrders: ov.todayOrders
          });
        }).catch(function () { K.$('#tiles').innerHTML = '<p class="muted">Could not load your dashboard. Please refresh.</p>'; });
      } else {
        var me = D.businesses[0], plan = D.plans.filter(function (p) { return p.name === me.plan; })[0];
        render({ firstName: 'Kasun', storeName: me.name, orders: K.orders(), products: D.products.filter(function (p) { return p.store === 'abc-fashion'; }), plan: me.plan, maxProducts: plan ? plan.maxProducts : null, expiry: me.expiry, sales7: D.sales7, today: D.today });
      }
    })();
  </script>
</body>
</html>
